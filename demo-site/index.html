<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Private S3 × CloudFront OAC</title>
    <style>
      :root {
        font-family: Inter, Pretendard, system-ui, sans-serif;
        color: #f8fafc;
        background: #07111f;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px;
        background:
          radial-gradient(circle at 20% 20%, rgba(56, 189, 248, 0.18), transparent 34%),
          radial-gradient(circle at 80% 80%, rgba(129, 140, 248, 0.16), transparent 36%),
          #07111f;
      }

      main {
        width: min(780px, 100%);
        padding: clamp(28px, 6vw, 64px);
        border: 1px solid rgba(148, 163, 184, 0.22);
        border-radius: 28px;
        background: rgba(15, 23, 42, 0.78);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.32);
      }

      .eyebrow {
        color: #38bdf8;
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 16px 0;
        font-size: clamp(2.4rem, 8vw, 5.4rem);
        line-height: 0.98;
        letter-spacing: -0.055em;
      }

      p {
        color: #cbd5e1;
        font-size: clamp(1rem, 2vw, 1.18rem);
        line-height: 1.75;
      }

      .flow {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        margin-top: 30px;
      }

      .node {
        padding: 10px 14px;
        border: 1px solid rgba(56, 189, 248, 0.32);
        border-radius: 999px;
        background: rgba(14, 165, 233, 0.09);
        color: #e0f2fe;
        font-size: 0.9rem;
        font-weight: 700;
      }

      .arrow { color: #64748b; }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Verified delivery path</div>
      <h1>Private origin.<br />Public delivery.</h1>
      <p>
        이 문서는 공개 S3 웹사이트가 아닙니다. CloudFront가 Origin Access
        Control로 요청에 서명하고, 비공개 S3 버킷은 지정된 배포의 읽기 요청만
        허용합니다.
      </p>
      <div class="flow" aria-label="Delivery architecture">
        <span class="node">HTTPS Client</span>
        <span class="arrow">→</span>
        <span class="node">CloudFront</span>
        <span class="arrow">→ SigV4 OAC →</span>
        <span class="node">Private S3</span>
      </div>
    </main>
  </body>
</html>
