name: Deploy production manually

on:
  workflow_dispatch:
    inputs:
      perform_deploy:
        description: "Upload the verified static build to the private S3 origin"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-article
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify and build
        run: npm test

      - name: Store the static build
        uses: actions/upload-artifact@v7
        with:
          name: article-static-build
          path: frontend/dist/client
          if-no-files-found: error

  deploy:
    if: ${{ inputs.perform_deploy }}
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the verified build
        uses: actions/download-artifact@v8
        with:
          name: article-static-build
          path: site-artifact

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload to the private S3 origin
        run: aws s3 sync site-artifact "s3://${{ vars.S3_BUCKET }}" --delete

      - name: Invalidate CloudFront
        run: >-
          aws cloudfront create-invalidation
          --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}"
          --paths "/*"
